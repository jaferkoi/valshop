<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoshop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Valoshop</a>
            <div class="navbar-nav">
                <a class="nav-link text-white" href="{% url 'catalog:skin_list' %}">Скины</a>
                    {% if user.is_authenticated %}
                        <a class="nav-link text-white" href="{% url 'users:profile' %}">Профиль</a>
                        <a class="nav-link text-white" href="{% url 'users:logout' %}">Выйти</a>
                    {% else %}
                        <a class="nav-link text-white" href="{% url 'users:login' %}">Войти</a>
                        <a class="nav-link text-white" href="{% url 'users:signup' %}">Зарегестрироваться</a>
                    {% endif %}
            </div>
        </div>
    </nav>
        <div class="container">
        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
