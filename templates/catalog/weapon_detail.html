{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Оружие: {{ weapon.name }}</h2>
            </div>
            <div class="card-body">
                <p class="lead">Все доступные скины для этого оружия:</p>
                
                <ul class="list-group">
                    {% for skin in skins %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <a href="{% url 'catalog:skin_detail' skin.slug %}" class="text-decoration-none">
                                <strong>{{ skin.name }}</strong>
                            </a>
                            <span class="badge bg-secondary">{{ skin.slug }}</span>
                        </li>
                    {% empty %}
                        <li class="list-group-item text-muted">Для этого оружия пока нет скинов.</li>
                    {% endfor %}
                </ul>
                
            </div>
        </div>
        <a href="{% url 'catalog:skin_list' %}" class="btn btn-outline-secondary">&larr; Назад ко всем скинам</a>
    </div>
</div>
{% endblock %}
