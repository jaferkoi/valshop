{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h1 class="h4 mb-3">Выйти из аккаунта?</h1>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, выйти</button>
                    <a href="{% url 'catalog:skin_list' %}" class="btn btn-outline-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
